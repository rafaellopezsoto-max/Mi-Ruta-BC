<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Ruta+ | Panel de Administración</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <!-- Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-100 font-sans h-screen w-screen overflow-hidden flex flex-col md:flex-row">

  <!-- Panel Lateral de Control -->
  <aside class="z-10 w-full md:w-96 bg-white border-r border-slate-200 shadow-xl flex flex-col h-2/5 md:h-full relative">
    
    <!-- Encabezado -->
    <div class="p-4 bg-slate-900 text-white flex items-center justify-between shadow">
      <div class="flex items-center gap-2">
        <span class="text-2xl">⚙️</span>
        <div>
          <h1 class="font-bold text-lg leading-tight">Panel de Control</h1>
          <p class="text-xs text-slate-400">Simulador & Despacho de Unidades</p>
        </div>
      </div>
      <span id="socket-status" class="w-3 h-3 bg-red-500 rounded-full" title="Desconectado"></span>
    </div>

    <!-- Formulario / Acciones de Admin -->
    <div class="flex-1 overflow-y-auto p-4 space-y-5">
      
      <!-- Sección: Configuración de Unidad -->
      <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-3">
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Lanzar Simulación de Unidad</label>
        
        <div>
          <label class="block text-[11px] font-medium text-slate-500 mb-1">ID de Unidad</label>
          <input id="unit-id-input" type="text" value="U-101" class="w-full text-xs p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>

        <div>
          <label class="block text-[11px] font-medium text-slate-500 mb-1">Ruta Asignada</label>
          <select id="route-select" class="w-full text-xs p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
            <option value="">Cargando rutas...</option>
          </select>
        </div>

        <div class="pt-1 flex gap-2">
          <button id="btn-start" onclick="startSimulation()" class="flex-1 py-2.5 bg-emerald-600 text-white font-semibold text-xs rounded-lg hover:bg-emerald-700 transition">
            ▶ Iniciar Recorrido
          </button>
          <button id="btn-stop" onclick="stopSimulation()" disabled class="flex-1 py-2.5 bg-rose-600 text-white font-semibold text-xs rounded-lg hover:bg-rose-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
            ⏹ Detener
          </button>
        </div>
      </div>

      <!-- Estado de la Transmisión -->
      <div class="space-y-2">
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Telemetría Enviada</label>
        
        <div class="p-3 bg-slate-900 text-emerald-400 font-mono text-[11px] rounded-lg space-y-1 shadow-inner h-32 overflow-y-auto" id="telemetry-log">
          <p class="text-slate-500">// Esperando inicio de simulación...</p>
        </div>
      </div>

    </div>

    <!-- Indicador Inferior -->
    <div class="p-3 border-t border-slate-200 bg-slate-50 text-[11px] text-slate-500 flex justify-between items-center">
      <span>Frecuencia: <b>3 segundos</b></span>
      <span id="active-units-count" class="bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded">0 Activas</span>
    </div>

  </aside>

  <!-- Contenedor del Mapa -->
  <main class="flex-1 relative h-3/5 md:h-full">
    <div id="map" class="w-full h-full"></div>
  </main>

  <script>
    const socket = io();
    let map = null;
    let simulationTimer = null;
    let routePoints = [];
    let currentPointIndex = 0;
    let currentMarker = null;

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      setupSocketEvents();
      fetchRoutes();
    });

    // Inicializar Mapa
    function initMap() {
      map = new maplibregl.Map({
        container: 'map',
        style: 'https://demotiles.maplibre.org/style.json',
        center: [-117.0382, 32.5149],
        zoom: 12
      });

      map.addControl(new maplibregl.NavigationControl(), 'top-right');
    }

    // Socket status
    function setupSocketEvents() {
      const statusIndicator = document.getElementById('socket-status');

      socket.on('connect', () => {
        statusIndicator.className = 'w-3 h-3 bg-emerald-500 rounded-full';
        statusIndicator.title = 'Conectado al servidor WebSocket';
      });

      socket.on('disconnect', () => {
        statusIndicator.className = 'w-3 h-3 bg-red-500 rounded-full';
        statusIndicator.title = 'Desconectado';
      });
    }

    // Cargar selector de rutas
    async function fetchRoutes() {
      try {
        const res = await fetch('/api/routes');
        const routes = await res.json();
        const select = document.getElementById('route-select');
        select.innerHTML = '<option value="">-- Selecciona una Ruta --</option>';

        routes.forEach(route => {
          const opt = document.createElement('option');
          opt.value = route.id;
          opt.textContent = route.name;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error('Error al obtener rutas:', err);
      }
    }

    // Iniciar Simulación
    async function startSimulation() {
      const routeId = document.getElementById('route-select').value;
      const unitId = document.getElementById('unit-id-input').value.trim();

      if (!routeId || !unitId) {
        alert('Por favor selecciona una ruta e ingresa un ID de unidad.');
        return;
      }

      try {
        const res = await fetch(`/api/routes/${routeId}/stops`);
        const stops = await res.json();

        if (!stops || stops.length < 2) {
          alert('La ruta seleccionada necesita al menos 2 paradas para simular el trayecto.');
          return;
        }

        // Convertir paradas en secuencia de coordenadas
        routePoints = stops.map(s => [s.lng, s.lat]);
        currentPointIndex = 0;

        document.getElementById('btn-start').disabled = true;
        document.getElementById('btn-stop').disabled = false;
        document.getElementById('active-units-count').innerText = '1 Activa';

        logTelemetry(`[SISTEMA] Iniciando recorrido para ${unitId} en Ruta #${routeId}`);

        // Bucle de emisión cada 3 segundos
        simulationTimer = setInterval(() => {
          emitCurrentLocation(unitId, routeId);
        }, 3000);

        emitCurrentLocation(unitId, routeId);

      } catch (err) {
        console.error('Error al iniciar la simulación:', err);
      }
    }

    // Emitir punto GPS vía WebSocket
    function emitCurrentLocation(unitId, routeId) {
      if (currentPointIndex >= routePoints.length) {
        currentPointIndex = 0; // Bucle continuo
      }

      const [lng, lat] = routePoints[currentPointIndex];
      const timestamp = new Date().toISOString();

      const payload = {
        unitId,
        routeId,
        lat,
        lng,
        updatedAt: timestamp
      };

      // Notificar al backend
      socket.emit('update_location', payload);

      // Actualizar marcador visual en el mapa de admin
      updateAdminMarker(unitId, lat, lng);

      // Mostrar log
      logTelemetry(`[GPS SENT] ${unitId} -> Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`);

      currentPointIndex++;
    }

    // Actualizar icono en el mapa del admin
    function updateAdminMarker(unitId, lat, lng) {
      if (currentMarker) {
        currentMarker.setLngLat([lng, lat]);
      } else {
        const el = document.createElement('div');
        el.className = 'bg-amber-500 text-white text-[11px] font-bold px-2 py-1 rounded-full shadow-lg border-2 border-slate-900 flex items-center gap-1';
        el.innerHTML = `⚙️ ${unitId}`;

        currentMarker = new maplibregl.Marker({ element: el })
          .setLngLat([lng, lat])
          .addTo(map);
      }

      map.flyTo({ center: [lng, lat], zoom: 14 });
    }

    // Detener simulación
    function stopSimulation() {
      clearInterval(simulationTimer);
      simulationTimer = null;

      document.getElementById('btn-start').disabled = false;
      document.getElementById('btn-stop').disabled = true;
      document.getElementById('active-units-count').innerText = '0 Activas';

      logTelemetry('[SISTEMA] Simulación detenida.');
    }

    // Log de consola interna
    function logTelemetry(msg) {
      const logBox = document.getElementById('telemetry-log');
      const p = document.createElement('p');
      p.textContent = msg;
      logBox.appendChild(p);
      logBox.scrollTop = logBox.scrollHeight;
    }
  </script>
</body>
</html>
