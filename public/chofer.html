<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Transmitir ubicación - Chofer</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1c2b26;
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p { color: #b7c2bc; font-size: 14px; margin-top: 0; }
  input {
    width: 100%;
    max-width: 280px;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin: 16px 0;
    font-size: 16px;
    text-align: center;
  }
  select {
    width: 100%;
    max-width: 280px;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin: 8px 0 0;
    font-size: 15px;
    text-align: center;
    background: white;
    color: #1c2b26;
  }
  label.field-label {
    font-size: 12px;
    color: #b7c2bc;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 12px;
    display: block;
  }
  button {
    padding: 16px 32px;
    border-radius: 999px;
    border: none;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    background: #2f8f66;
    color: white;
  }
  button.stop { background: #a5423a; }
  #status { margin-top: 20px; font-size: 13px; color: #b7c2bc; }
  #dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block; margin-right: 6px; background: #666;
  }
  #dot.live { background: #4ade80; }
</style>
</head>
<body>
  <h1>Transmitir mi ubicación</h1>
  <p>Deja esta pantalla abierta mientras conduces tu ruta</p>

  <input id="unitId" type="number" placeholder="ID de tu unidad (ej. 1)" />

  <label class="field-label" for="routeSelect">¿Hacia dónde vas ahora?</label>
  <select id="routeSelect"></select>

  <button id="toggleBtn">Iniciar transmisión</button>

  <div id="status"><span id="dot"></span>Detenido</div>

<script>
let watchId = null;

const btn = document.getElementById('toggleBtn');
const statusEl = document.getElementById('status');
const dot = document.getElementById('dot');
const routeSelect = document.getElementById('routeSelect');

async function loadRoutes() {
  const res = await fetch('/api/routes');
  const routes = await res.json();
  routeSelect.innerHTML = routes.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
}
loadRoutes();

btn.addEventListener('click', () => {
  if (watchId) {
    stop();
  } else {
    start();
  }
});

function start() {
  const unitId = document.getElementById('unitId').value;
  if (!unitId) {
    alert('Escribe el ID de tu unidad primero');
    return;
  }
  if (!navigator.geolocation) {
    alert('Este navegador no soporta geolocalización');
    return;
  }
  watchId = navigator.geolocation.watchPosition(
    (pos) => sendLocation(unitId, pos.coords.latitude, pos.coords.longitude),
    (err) => { statusEl.textContent = 'Error de GPS: ' + err.message; },
    { enableHighAccuracy: true, maximumAge: 4000, timeout: 10000 }
  );
  btn.textContent = 'Detener transmisión';
  btn.classList.add('stop');
  dot.classList.add('live');
  statusEl.textContent = 'Transmitiendo…';
}

function stop() {
  navigator.geolocation.clearWatch(watchId);
  watchId = null;
  btn.textContent = 'Iniciar transmisión';
  btn.classList.remove('stop');
  dot.classList.remove('live');
  statusEl.innerHTML = '<span id="dot"></span>Detenido';
}

async function sendLocation(unitId, lat, lng) {
  try {
    const routeId = routeSelect.value;
    await fetch(`/api/units/${unitId}/location`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lat, lng, routeId })
    });
    statusEl.innerHTML = `<span id="dot" class="live"></span>Última señal: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  } catch (e) {
    statusEl.textContent = 'No se pudo enviar la ubicación';
  }
}
</script>
</body>
</html>
