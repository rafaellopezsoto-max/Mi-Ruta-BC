<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mi Ruta+ | Panel del Chofer</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <!-- Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 font-sans h-screen w-screen overflow-hidden flex flex-col text-slate-100">

  <!-- Encabezado de Navegación Móvil -->
  <header class="p-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between shadow-md z-10">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-xl font-bold shadow-lg shadow-blue-500/20">
        🚌
      </div>
      <div>
        <h1 class="font-bold text-base leading-tight">Consola del Chofer</h1>
        <p id="status-text" class="text-xs text-amber-400 font-medium">Fuera de Servicio</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="socket-status" class="w-3 h-3 bg-red-500 rounded-full" title="Desconectado"></span>
    </div>
  </header>

  <!-- Panel Principal / Contenedor Flexible -->
  <div class="flex-1 flex flex-col md:flex-row relative overflow-hidden">

    <!-- Panel Lateral de Control -->
    <aside class="w-full md:w-96 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4 space-y-4 z-10 order-2 md:order-1">
      
      <!-- Selector de Configuración de Turno -->
      <div class="space-y-3">
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Configuración del Turno</label>
        
        <div>
          <label class="block text-[11px] font-medium text-slate-400 mb-1">Unidad Asignada</label>
          <select id="unit-select" class="w-full text-xs p-3 bg-slate-800 border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-white">
            <option value="1">Unidad A (ABC-123)</option>
            <option value="2">Unidad B (XYZ-789)</option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-medium text-slate-400 mb-1">Ruta a Transmitir</label>
          <select id="route-select" class="w-full text-xs p-3 bg-slate-800 border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-white">
            <option value="">Cargando rutas...</option>
          </select>
        </div>
      </div>

      <!-- Tarjeta de Pasajeros en Espera (Alertas en Tiempo Real) -->
      <div class="bg-slate-800/80 p-3.5 rounded-2xl border border-slate-700/60 space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            Pasajeros Cercanos
          </span>
          <span id="passenger-count" class="text-xs font-bold bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full">0 en ruta</span>
        </div>
        <p class="text-[11px] text-slate-400">
          Se notificarán los pasajeros que esperen transporte en tu recorrido actual.
        </p>
      </div>

      <!-- Botón de Acción Principal (Transmisión GPS) -->
      <div class="pt-2">
        <button id="btn-toggle-shift" onclick="toggleShift()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-2xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2">
          <span>📡</span> INICIAR TRANSMISIÓN GPS
        </button>
      </div>

    </aside>

    <!-- Mapa del Recorrido -->
    <main class="flex-1 relative h-64 md:h-full order-1 md:order-2">
      <div id="map" class="w-full h-full"></div>
    </main>

  </div>

  <script>
    const socket = io();
    let map = null;
    let isTransmitting = false;
    let watchId = null;
    let currentMarker = null;
    const passengerMarkers = {};

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      setupSocketEvents();
      fetchRoutes();
    });

    // Inicializar Mapa en modo oscuro (o neutro)
    function initMap() {
      map = new maplibregl.Map({
        container: 'map',
        style: 'https://demotiles.maplibre.org/style.json',
        center: [-117.0382, 32.5149],
        zoom: 13
      });

      map.addControl(new maplibregl.NavigationControl(), 'top-right');
    }

    // Configuración de WebSocket
    function setupSocketEvents() {
      const statusIndicator = document.getElementById('socket-status');

      socket.on('connect', () => {
        statusIndicator.className = 'w-3 h-3 bg-emerald-500 rounded-full';
        statusIndicator.title = 'Conectado al servidor';
      });

      socket.on('disconnect', () => {
        statusIndicator.className = 'w-3 h-3 bg-red-500 rounded-full';
        statusIndicator.title = 'Desconectado';
      });

      // Recibir actualizaciones de pasajeros esperando
      socket.on('passenger_update', ({ passengerId, lat, lng }) => {
        updatePassengerOnMap(passengerId, lat, lng);
      });
    }

    // Obtener la lista de rutas
    async function fetchRoutes() {
      try {
        const res = await fetch('/api/routes');
        const routes = await res.json();
        const select = document.getElementById('route-select');
        select.innerHTML = '<option value="">-- Selecciona tu Ruta --</option>';

        routes.forEach(route => {
          const opt = document.createElement('option');
          opt.value = route.id;
          opt.textContent = route.name;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error('Error al obtener rutas:', err);
      }
    }

    // Alternar el estado de transmisión (Iniciar / Detener turno)
    function toggleShift() {
      const unitId = document.getElementById('unit-select').value;
      const routeId = document.getElementById('route-select').value;

      if (!isTransmitting) {
        if (!routeId) {
          alert('Por favor selecciona una ruta antes de iniciar la transmisión.');
          return;
        }

        // Suscribirse a los avisos de pasajeros para esta ruta
        socket.emit('subscribe_route', routeId);

        if ("geolocation" in navigator) {
          // Obtener posición continua por GPS real del teléfono
          watchId = navigator.geolocation.watchPosition(
            (pos) => sendLocation(unitId, routeId, pos.coords.latitude, pos.coords.longitude),
            (err) => {
              console.warn("GPS no disponible, usando simulación local:", err.message);
              startSimulatedGps(unitId, routeId);
            },
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
          );
        } else {
          startSimulatedGps(unitId, routeId);
        }

        isTransmitting = true;
        updateUI(true);
      } else {
        // Detener transmisión
        if (watchId) navigator.geolocation.clearWatch(watchId);
        if (window.simInterval) clearInterval(window.simInterval);

        isTransmitting = false;
        updateUI(false);
      }
    }

    // Enviar coordenadas al servidor por HTTP POST
    async function sendLocation(unitId, routeId, lat, lng) {
      try {
        await fetch(`/api/units/${unitId}/location`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lat, lng, routeId: Number(routeId) })
        });

        updateDriverMarker(lat, lng);
      } catch (err) {
        console.error('Error enviando GPS:', err);
      }
    }

    // Fallback con simulación si no se da permiso de GPS
    function startSimulatedGps(unitId, routeId) {
      let lat = 32.5149;
      let lng = -117.0382;

      window.simInterval = setInterval(() => {
        lat -= 0.001;
        lng -= 0.001;
        sendLocation(unitId, routeId, lat, lng);
      }, 3000);
    }

    // Actualizar la posición de mi camión en el mapa
    function updateDriverMarker(lat, lng) {
      if (currentMarker) {
        currentMarker.setLngLat([lng, lat]);
      } else {
        const el = document.createElement('div');
        el.className = 'w-10 h-10 bg-blue-600 border-4 border-white rounded-full shadow-2xl flex items-center justify-center text-lg';
        el.innerHTML = '🚌';

        currentMarker = new maplibregl.Marker({ element: el })
          .setLngLat([lng, lat])
          .addTo(map);
      }

      map.flyTo({ center: [lng, lat], zoom: 15 });
    }

    // Mostrar pasajero esperando en el mapa
    function updatePassengerOnMap(passengerId, lat, lng) {
      if (passengerMarkers[passengerId]) {
        passengerMarkers[passengerId].setLngLat([lng, lat]);
      } else {
        const el = document.createElement('div');
        el.className = 'w-8 h-8 bg-emerald-500 border-2 border-white rounded-full shadow-lg flex items-center justify-center text-xs animate-bounce';
        el.innerHTML = '🙋‍♂️';

        passengerMarkers[passengerId] = new maplibregl.Marker({ element: el })
          .setLngLat([lng, lat])
          .addTo(map);
      }

      const total = Object.keys(passengerMarkers).length;
      document.getElementById('passenger-count').innerText = `${total} en ruta`;
    }

    // Actualizar interfaz según el estado del turno
    function updateUI(transmitting) {
      const btn = document.getElementById('btn-toggle-shift');
      const statusText = document.getElementById('status-text');
      const unitSelect = document.getElementById('unit-select');
      const routeSelect = document.getElementById('route-select');

      if (transmitting) {
        btn.className = "w-full py-4 bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm rounded-2xl shadow-lg shadow-rose-600/30 transition-all flex items-center justify-center gap-2";
        btn.innerHTML = "<span>⏹</span> DETENER TRANSMISIÓN";
        statusText.innerText = "Transmitiendo en Vivo";
        statusText.className = "text-xs text-emerald-400 font-medium animate-pulse";
        unitSelect.disabled = true;
        routeSelect.disabled = true;
      } else {
        btn.className = "w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-2xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2";
        btn.innerHTML = "<span>📡</span> INICIAR TRANSMISIÓN GPS";
        statusText.innerText = "Fuera de Servicio";
        statusText.className = "text-xs text-amber-400 font-medium";
        unitSelect.disabled = false;
        routeSelect.disabled = false;
      }
    }
  </script>
</body>
</html>
