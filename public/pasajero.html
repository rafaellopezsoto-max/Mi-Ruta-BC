<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Ruta+ | Rastreo de Transporte Público</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <!-- Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-100 font-sans h-screen w-screen overflow-hidden flex flex-col md:flex-row">

  <!-- Panel Lateral / Bottom Sheet en Móviles -->
  <aside class="z-10 w-full md:w-96 bg-white border-r border-slate-200 shadow-xl flex flex-col h-2/5 md:h-full relative">
    
    <!-- Encabezado -->
    <div class="p-4 bg-slate-900 text-white flex items-center justify-between shadow">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🚌</span>
        <div>
          <h1 class="font-bold text-lg leading-tight">Mi Ruta+</h1>
          <p class="text-xs text-slate-400">Rosarito & Tijuana, B.C.</p>
        </div>
      </div>
      <span id="socket-status" class="w-3 h-3 bg-red-500 rounded-full" title="Desconectado"></span>
    </div>

    <!-- Pestañas de Navegación -->
    <div class="flex border-b border-slate-200 bg-slate-50">
      <button id="tab-routes-btn" onclick="switchTab('routes')" class="flex-1 py-3 text-xs font-semibold text-blue-600 border-b-2 border-blue-600">
        RUTAS ACTIVAS
      </button>
      <button id="tab-planner-btn" onclick="switchTab('planner')" class="flex-1 py-3 text-xs font-semibold text-slate-500 hover:text-slate-700">
        PLANEAR VIAJE
      </button>
    </div>

    <!-- Contenido del Panel -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4">
      
      <!-- Pestaña 1: Rutas -->
      <div id="tab-routes" class="space-y-3">
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Selecciona una Ruta</label>
        <div id="routes-list" class="space-y-2">
          <p class="text-xs text-slate-400">Cargando rutas disponibles...</p>
        </div>
      </div>

      <!-- Pestaña 2: Planeador de Viaje -->
      <div id="tab-planner" class="space-y-3 hidden">
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">¿A dónde quieres ir?</label>
        <div class="space-y-2">
          <input id="plan-origin" type="text" placeholder="Origen (ej. Centro)" class="w-full text-xs p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
          <input id="plan-dest" type="text" placeholder="Destino (ej. Bulevar)" class="w-full text-xs p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
          <button onclick="findTrip()" class="w-full py-2.5 bg-blue-600 text-white font-semibold text-xs rounded-lg hover:bg-blue-700 transition">
            Buscar Mejor Ruta
          </button>
        </div>
        <div id="planner-results" class="space-y-2 pt-2"></div>
      </div>

    </div>

    <!-- Tarjeta de Estado de la Unidad Seleccionada -->
    <div id="unit-info-card" class="p-4 border-t border-slate-200 bg-blue-50 hidden">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold text-sm">
            🚌
          </div>
          <div>
            <h3 id="card-unit-title" class="text-sm font-bold text-slate-800">Unidad 1</h3>
            <p id="card-unit-sub" class="text-xs text-slate-500">Ruta 1 • Transmisión en vivo</p>
          </div>
        </div>
        <span id="card-unit-time" class="text-[10px] bg-blue-100 text-blue-700 font-semibold px-2 py-1 rounded">Justo ahora</span>
      </div>
    </div>

  </aside>

  <!-- Contenedor del Mapa -->
  <main class="flex-1 relative h-3/5 md:h-full">
    <div id="map" class="w-full h-full"></div>
  </main>

  <script>
    const socket = io();
    let map = null;
    let selectedRouteId = null;
    const unitMarkers = {};
    const stopMarkers = [];

    // Inicializar aplicación
    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      setupSocketEvents();
      fetchRoutes();
    });

    // Configurar Mapa con MapLibre GL
    function initMap() {
      map = new maplibregl.Map({
        container: 'map',
        style: 'https://demotiles.maplibre.org/style.json',
        center: [-117.0382, 32.5149], // Coordenadas Rosarito/Tijuana
        zoom: 12
      });

      map.addControl(new maplibregl.NavigationControl(), 'top-right');
    }

    // Configurar WebSocket
    function setupSocketEvents() {
      const statusIndicator = document.getElementById('socket-status');

      socket.on('connect', () => {
        statusIndicator.className = 'w-3 h-3 bg-emerald-500 rounded-full';
        statusIndicator.title = 'Conectado en tiempo real';
      });

      socket.on('disconnect', () => {
        statusIndicator.className = 'w-3 h-3 bg-red-500 rounded-full';
        statusIndicator.title = 'Desconectado';
      });

      // Recibir posición en tiempo real de los camiones
      socket.on('location_update', ({ unitId, lat, lng, updatedAt }) => {
        updateUnitMarker(unitId, lat, lng);
        document.getElementById('unit-info-card').classList.remove('hidden');
        document.getElementById('card-unit-title').innerText = `Unidad ${unitId}`;
        document.getElementById('card-unit-time').innerText = new Date(updatedAt).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      });
    }

    // Cargar lista de rutas desde la API
    async function fetchRoutes() {
      try {
        const res = await fetch('/api/routes');
        const routes = await res.json();
        const container = document.getElementById('routes-list');
        container.innerHTML = '';

        routes.forEach(route => {
          const btn = document.createElement('button');
          btn.className = 'w-full text-left p-3 rounded-lg border border-slate-200 hover:border-blue-500 bg-white transition flex items-center justify-between group';
          btn.onclick = () => selectRoute(route.id, route.color);
          btn.innerHTML = `
            <div>
              <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full" style="background-color: ${route.color || '#2563eb'}"></span>
                <span class="font-bold text-xs text-slate-800">${route.name}</span>
              </div>
              <p class="text-[11px] text-slate-500 mt-1">${route.description || 'Sin descripción'}</p>
            </div>
            <span class="text-xs text-blue-600 opacity-0 group-hover:opacity-100 font-semibold transition">Ver →</span>
          `;
          container.appendChild(btn);
        });
      } catch (err) {
        console.error('Error al cargar rutas:', err);
      }
    }

    // Seleccionar ruta y suscribir
    async function selectRoute(routeId, color) {
      if (selectedRouteId) {
        socket.emit('unsubscribe_route', selectedRouteId);
      }

      selectedRouteId = routeId;
      socket.emit('subscribe_route', routeId);

      // Cargar paradas de la ruta
      fetchStops(routeId);
    }

    // Renderizar paradas en el mapa
    async function fetchStops(routeId) {
      try {
        const res = await fetch(`/api/routes/${routeId}/stops`);
        const stops = await res.json();

        // Limpiar paradas anteriores
        stopMarkers.forEach(m => m.remove());
        stopMarkers.length = 0;

        if (stops.length === 0) return;

        const bounds = new maplibregl.LngLatBounds();

        stops.forEach(stop => {
          const el = document.createElement('div');
          el.className = 'w-4 h-4 bg-white border-2 border-slate-800 rounded-full shadow-md flex items-center justify-center';
          
          const marker = new maplibregl.Marker({ element: el })
            .setLngLat([stop.lng, stop.lat])
            .setPopup(new maplibregl.Popup().setHTML(`<b class="text-xs">${stop.name}</b>`))
            .addTo(map);

          stopMarkers.push(marker);
          bounds.extend([stop.lng, stop.lat]);
        });

        map.fitBounds(bounds, { padding: 50 });

      } catch (err) {
        console.error('Error al cargar paradas:', err);
      }
    }

    // Crear/actualizar marcador del camión en movimiento
    function updateUnitMarker(unitId, lat, lng) {
      if (unitMarkers[unitId]) {
        unitMarkers[unitId].setLngLat([lng, lat]);
      } else {
        const el = document.createElement('div');
        el.className = 'bg-blue-600 text-white text-[11px] font-bold px-2 py-1 rounded-full shadow-lg border-2 border-white flex items-center gap-1 animate-bounce';
        el.innerHTML = `🚌 U${unitId}`;

        unitMarkers[unitId] = new maplibregl.Marker({ element: el })
          .setLngLat([lng, lat])
          .addTo(map);
      }
    }

    // Cambiar Pestañas
    function switchTab(tab) {
      document.getElementById('tab-routes').classList.toggle('hidden', tab !== 'routes');
      document.getElementById('tab-planner').classList.toggle('hidden', tab !== 'planner');

      document.getElementById('tab-routes-btn').className = tab === 'routes' 
        ? 'flex-1 py-3 text-xs font-semibold text-blue-600 border-b-2 border-blue-600'
        : 'flex-1 py-3 text-xs font-semibold text-slate-500 hover:text-slate-700';

      document.getElementById('tab-planner-btn').className = tab === 'planner'
        ? 'flex-1 py-3 text-xs font-semibold text-blue-600 border-b-2 border-blue-600'
        : 'flex-1 py-3 text-xs font-semibold text-slate-500 hover:text-slate-700';
    }

    // Algoritmo de Búsqueda de Viaje Simulado
    async function findTrip() {
      const resultsContainer = document.getElementById('planner-results');
      resultsContainer.innerHTML = '<p class="text-xs text-slate-400">Calculando la mejor combinación...</p>';

      setTimeout(() => {
        resultsContainer.innerHTML = `
          <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-lg space-y-1">
            <span class="text-[10px] font-bold bg-emerald-200 text-emerald-800 px-1.5 py-0.5 rounded">Ruta Recomendada</span>
            <h4 class="font-bold text-xs text-slate-800">Ruta 1 - Centro / Bulevar</h4>
            <p class="text-[11px] text-slate-600">Aborda en <b>Parada Centro</b> → Baja en <b>Parada Plaza</b></p>
            <p class="text-[10px] text-slate-400">Tiempo aprox. de trayecto: 12 min</p>
          </div>
        `;
      }, 600);
    }
  </script>
</body>
</html>
