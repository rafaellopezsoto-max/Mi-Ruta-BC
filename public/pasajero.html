<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>¿Dónde va mi camión?</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --ink: #1c2b26;
    --paper: #f4f6f2;
    --line: #d7ddd2;
    --accent: #1f6e4f;
    --accent-dim: #e4efe8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  header span { font-size: 13px; color: #6b756f; }
  #map { height: 46vh; width: 100%; }
  .panel { padding: 16px 20px; }
  .panel h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: #6b756f; margin: 0 0 10px; }
  select, button {
    font: inherit;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: white;
  }
  select { width: 100%; margin-bottom: 12px; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    cursor: pointer;
    width: 100%;
  }
  .unit-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 8px;
    background: white;
  }
  .unit-card .plate { font-weight: 700; }
  .unit-card .driver { font-size: 13px; color: #6b756f; }
  .eta-badge {
    background: var(--accent-dim);
    color: var(--accent);
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 13px;
  }
  .empty { color: #6b756f; font-size: 14px; }
  .stop-banner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .stop-banner button {
    width: auto;
    padding: 6px 10px;
    font-size: 12px;
    background: white;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
</style>
</head>
<body>

<header>
  <h1>¿Dónde va mi camión?</h1>
  <span>Elige tu ruta y ve la unidad acercarse</span>
</header>

<div class="panel">
  <select id="routeSelect"></select>
</div>

<div id="map"></div>

<div class="panel">
  <div id="stopBanner" class="stop-banner">
    <span id="stopBannerText">Ubicando tu parada más cercana…</span>
    <button id="relocateBtn">Reintentar</button>
  </div>
  <h2>Unidades en camino</h2>
  <div id="unitsList" class="empty">Selecciona una ruta para ver las unidades activas.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
const API = '';
const socket = io();
const map = L.map('map').setView([32.52, -117.02], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

let stopMarkers = [];
let unitMarkers = {}; // unitId -> marker
let currentRouteId = null;
let currentStops = [];
let activeUnits = []; // metadata de las unidades activas de la ruta actual
let passengerStop = null; // parada mas cercana al pasajero, detectada por GPS
let passengerMarker = null;

function distanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function locatePassenger() {
  const bannerText = document.getElementById('stopBannerText');
  if (!navigator.geolocation) {
    bannerText.textContent = 'Tu navegador no soporta geolocalización. Mostrando ETA a la primera parada.';
    passengerStop = null;
    renderUnitsList();
    return;
  }
  bannerText.textContent = 'Ubicando tu parada más cercana…';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      if (!currentStops.length) return;
      let best = currentStops[0];
      let bestDist = Infinity;
      currentStops.forEach(stop => {
        const d = distanceKm(pos.coords.latitude, pos.coords.longitude, stop.lat, stop.lng);
        if (d < bestDist) { bestDist = d; best = stop; }
      });
      passengerStop = best;
      bannerText.textContent = `Tu parada: ${best.name} (a ${bestDist.toFixed(2)} km de ti)`;

      if (passengerMarker) map.removeLayer(passengerMarker);
      passengerMarker = L.circleMarker([pos.coords.latitude, pos.coords.longitude], {
        radius: 7, color: '#2f6fed', fillColor: '#2f6fed', fillOpacity: 0.8
      }).addTo(map).bindPopup('Tú estás aquí');

      renderUnitsList();
    },
    (err) => {
      bannerText.textContent = 'No se pudo obtener tu ubicación. Mostrando ETA a la primera parada.';
      passengerStop = null;
      renderUnitsList();
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

document.getElementById('relocateBtn').addEventListener('click', locatePassenger);

async function loadRoutes() {
  const res = await fetch(`${API}/api/routes`);
  const routes = await res.json();
  const select = document.getElementById('routeSelect');
  select.innerHTML = routes.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
  select.addEventListener('change', () => selectRoute(select.value));
  if (routes.length) selectRoute(routes[0].id);
}

async function selectRoute(routeId) {
  if (currentRouteId) socket.emit('unsubscribe_route', currentRouteId);
  currentRouteId = routeId;
  socket.emit('subscribe_route', routeId);

  stopMarkers.forEach(m => map.removeLayer(m));
  stopMarkers = [];
  Object.values(unitMarkers).forEach(m => map.removeLayer(m));
  unitMarkers = {};

  const stopsRes = await fetch(`${API}/api/routes/${routeId}/stops`);
  currentStops = await stopsRes.json();
  currentStops.forEach(stop => {
    const marker = L.circleMarker([stop.lat, stop.lng], { radius: 6, color: '#1f6e4f' })
      .addTo(map)
      .bindPopup(stop.name);
    stopMarkers.push(marker);
  });
  if (currentStops.length) {
    map.fitBounds(currentStops.map(s => [s.lat, s.lng]), { padding: [30, 30] });
  }

  await loadActiveUnits();
  locatePassenger();
}

async function loadActiveUnits() {
  const res = await fetch(`${API}/api/units/active`);
  const all = await res.json();
  activeUnits = all.filter(u => String(u.route_id) === String(currentRouteId));
  renderUnitsList();
  activeUnits.forEach(u => {
    if (u.position) placeUnitMarker(u.unit_id, u.position.lat, u.position.lng);
  });
}

function placeUnitMarker(unitId, lat, lng) {
  if (unitMarkers[unitId]) {
    unitMarkers[unitId].setLatLng([lat, lng]);
  } else {
    unitMarkers[unitId] = L.marker([lat, lng], {
      icon: L.divIcon({ className: '', html: '<div style="background:#1f6e4f;width:14px;height:14px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #1f6e4f"></div>' })
    }).addTo(map);
  }
}

function etaMinutesTo(lat, lng, destLat, destLng, speedKmh = 18) {
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(destLat - lat);
  const dLng = toRad(destLng - lng);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat))*Math.cos(toRad(destLat))*Math.sin(dLng/2)**2;
  const distanceKm = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return Math.round((distanceKm / speedKmh) * 60);
}

function renderUnitsList() {
  const list = document.getElementById('unitsList');
  if (!activeUnits.length) {
    list.className = 'empty';
    list.textContent = 'No hay unidades activas en esta ruta por ahora.';
    return;
  }
  list.className = '';
  list.innerHTML = activeUnits.map(u => {
    let etaText = 'Ubicando…';
    const targetStop = passengerStop || currentStops[0];
    if (u.position && targetStop) {
      const mins = etaMinutesTo(u.position.lat, u.position.lng, targetStop.lat, targetStop.lng);
      etaText = `${mins} min a tu parada`;
    }
    return `<div class="unit-card" data-unit="${u.unit_id}">
      <div>
        <div class="plate">Unidad ${u.plate}</div>
        <div class="driver">Chofer: ${u.driver_name}</div>
      </div>
      <div class="eta-badge">${etaText}</div>
    </div>`;
  }).join('');
}

socket.on('location_update', (data) => {
  const unit = activeUnits.find(u => u.unit_id === data.unitId);
  if (!unit) return; // no es de la ruta que estamos viendo
  unit.position = { lat: data.lat, lng: data.lng };
  placeUnitMarker(data.unitId, data.lat, data.lng);
  renderUnitsList();
});

loadRoutes();
</script>
</body>
</html>
