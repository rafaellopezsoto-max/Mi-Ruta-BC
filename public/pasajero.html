<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MiRuta+ | Pasajero</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <!-- Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 font-sans h-screen w-screen flex justify-center items-center overflow-hidden">

  <!-- Contenedor Estilo App Móvil -->
  <div class="w-full max-w-md h-full md:h-[92vh] bg-slate-900 md:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-slate-800">
    
    <!-- Mapa de Fondo -->
    <div id="map" class="absolute inset-0 z-0 h-full w-full"></div>

    <!-- Capa Superior: Búsqueda y Estado -->
    <div class="relative z-10 p-4 space-y-3 bg-gradient-to-b from-slate-950/90 via-slate-900/60 to-transparent pt-6">
      <div class="flex justify-between items-center text-xs font-bold text-slate-300">
        <span>ROSARITO - TIJUANA</span>
        <span class="flex items-center gap-1.5 text-emerald-400">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          EN VIVO
        </span>
      </div>

      <div class="bg-slate-900/90 backdrop-blur-md rounded-2xl p-2 shadow-xl border border-slate-700/50 flex items-center gap-2">
        <input id="search-input" type="text" placeholder="¿A dónde vas?" class="w-full bg-transparent px-3 py-2 text-sm text-white placeholder-slate-400 outline-none" />
        <button onclick="searchDestination()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-lg shadow-blue-500/30">
          Buscar
        </button>
      </div>
    </div>

    <div class="flex-1"></div>

    <!-- Capa Inferior: Panel de Control e Información -->
    <div class="relative z-10 bg-slate-900/95 backdrop-blur-xl rounded-t-3xl border-t border-slate-800 p-4 space-y-4 shadow-2xl max-h-[60vh] overflow-y-auto no-scrollbar">
      
      <!-- Botones Rápidos -->
      <div class="grid grid-cols-4 gap-2 text-center text-[10px] font-bold text-slate-400">
        <button onclick="recenterMap()" class="bg-slate-800/80 p-2.5 rounded-2xl border border-slate-700/50 flex flex-col items-center gap-1 hover:text-white transition">
          <span class="text-base">🎯</span> GPS EN VIVO
        </button>
        <button class="bg-slate-800/80 p-2.5 rounded-2xl border border-slate-700/50 flex flex-col items-center gap-1 hover:text-white transition">
          <span class="text-base">🗺️</span> DOS RUTAS
        </button>
        <button class="bg-slate-800/80 p-2.5 rounded-2xl border border-slate-700/50 flex flex-col items-center gap-1 hover:text-white transition">
          <span class="text-base">⏱️</span> TIEMPO REAL
        </button>
        <button onclick="shareTrip()" class="bg-slate-800/80 p-2.5 rounded-2xl border border-slate-700/50 flex flex-col items-center gap-1 hover:text-white transition">
          <span class="text-base">📲</span> COMPARTIR
        </button>
      </div>

      <!-- Sección de Rutas -->
      <div class="space-y-2">
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Rutas de la Red</p>
        <div class="grid grid-cols-2 gap-3" id="routes-container">
          <!-- Ruta 1 -->
          <div onclick="selectRoute(1)" class="bg-slate-800/50 p-3 rounded-2xl border border-slate-700/50 cursor-pointer hover:border-amber-500 transition">
            <div class="flex justify-between items-center mb-1">
              <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
              <span class="text-[9px] font-bold text-slate-400">VER</span>
            </div>
            <h4 class="text-xs font-bold text-white">Centro Tijuana</h4>
            <p class="text-[10px] text-slate-400">Blanco y amarillo</p>
          </div>
          <!-- Ruta 2 -->
          <div onclick="selectRoute(2)" class="bg-blue-900/20 p-3 rounded-2xl border border-blue-500/50 cursor-pointer">
            <div class="flex justify-between items-center mb-1">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
              <span class="text-[9px] font-bold text-blue-400">ACTIVA</span>
            </div>
            <h4 class="text-xs font-bold text-white">5 y 10 - UABC</h4>
            <p class="text-[10px] text-slate-400">Verde</p>
          </div>
        </div>
      </div>

      <!-- Tarjeta de Unidad Cercana -->
      <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
        <div class="flex justify-between items-start">
          <div>
            <h3 class="text-sm font-bold text-white" id="active-unit-name">Unidad ABC-123</h3>
            <p class="text-xs text-slate-400" id="active-driver-name">Chofer: Juan Pérez</p>
          </div>
          <span class="text-[10px] font-bold bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/30">
            ● EN VIVO
          </span>
        </div>

        <div class="flex items-baseline gap-1">
          <span class="text-3xl font-black text-white" id="eta-display">7</span>
          <span class="text-xs font-semibold text-slate-400">min a tu parada</span>
        </div>

        <button onclick="requestStop()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-blue-600/30 transition">
          🙋‍♂️ Solicitar Parada
        </button>
      </div>

    </div>

  </div>

  <script>
    const socket = io();
    let map = null;
    let unitMarker = null;
    const defaultCenter = [-117.0382, 32.5149]; // Coordenadas Rosarito - Tijuana

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      setupSocketEvents();
    });

    function initMap() {
      map = new maplibregl.Map({
        container: 'map',
        style: 'https://demotiles.maplibre.org/style.json',
        center: defaultCenter,
        zoom: 12.5
      });

      map.on('load', () => {
        // Dibujar Trazo de la Ruta en el Mapa
        map.addSource('route-line', {
          'type': 'geojson',
          'data': {
            'type': 'Feature',
            'geometry': {
              'type': 'LineString',
              'coordinates': [
                [-117.0550, 32.3650],
                [-117.0450, 32.4000],
                [-117.0382, 32.4500],
                [-117.0300, 32.5020],
                [-117.0200, 32.5149]
              ]
            }
          }
        });

        map.addLayer({
          'id': 'route-line-layer',
          'type': 'line',
          'source': 'route-line',
          'layout': { 'line-join': 'round', 'line-cap': 'round' },
          'paint': {
            'line-color': '#2563eb',
            'line-width': 5
          }
        });
      });
    }

    function setupSocketEvents() {
      socket.on('unit_updated', (data) => {
        const { lat, lng, unitId } = data;
        updateUnitMarker(lat, lng, unitId);
      });
    }

    function updateUnitMarker(lat, lng, unitId) {
      if (unitMarker) {
        unitMarker.setLngLat([lng, lat]);
      } else {
        const el = document.createElement('div');
        el.className = 'w-9 h-9 bg-blue-600 border-2 border-white rounded-full shadow-2xl flex items-center justify-center text-sm';
        el.innerHTML = '🚌';

        unitMarker = new maplibregl.Marker({ element: el })
          .setLngLat([lng, lat])
          .addTo(map);
      }
    }

    function recenterMap() {
      map.flyTo({ center: defaultCenter, zoom: 13, essential: true });
    }

    function selectRoute(routeId) {
      recenterMap();
      socket.emit('subscribe_route', routeId);
    }

    function requestStop() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          socket.emit('passenger_waiting', {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
          });
          alert('¡Parada solicitada! El chofer ha sido notificado.');
        });
      } else {
        alert('Por favor activa la ubicación de tu dispositivo.');
      }
    }

    function shareTrip() {
      if (navigator.share) {
        navigator.share({
          title: 'MiRuta+',
          text: 'Sigue el trayecto de mi unidad en tiempo real:',
          url: window.location.href
        });
      } else {
        alert('Enlace copiado al portapapeles');
      }
    }

    function searchDestination() {
      const query = document.getElementById('search-input').value;
      if (query) {
        alert(`Buscando ruta hacia: ${query}`);
      }
    }
  </script>
</body>
</html>
